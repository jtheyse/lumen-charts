<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen Charts on WebAssembly</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Lumen.Charts.Blazor/lumen.css" />
    <style>
        body{font:14px Segoe UI,Arial,sans-serif;margin:0;padding:24px;color:#26324B;background:#F7F8FC}
        main{max-width:980px;margin:0 auto}
        h1{font-size:23px;margin:0 0 6px}h2{font-size:16px;margin:34px 0 10px}
        p{margin:0 0 18px;color:#63718A}
        .kinds{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
        /* Scoped to this page's own controls: a bare button rule would restyle the component's legend. */
        .kinds button{font:inherit;font-size:12px;padding:7px 11px;border:1px solid #DCE3EE;border-radius:5px;background:#fff;color:inherit;cursor:pointer}
        .kinds button[aria-pressed=true]{border-color:#4B66CA;color:#4B66CA}
        .card{background:#fff;border:1px solid #E8EDF5;border-radius:10px;padding:6px 0}
        .state{font-size:12px}
    </style>
</head>
<body>
    <div id="app">Loading Lumen on WebAssembly…</div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
